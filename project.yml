name: Wisp
options:
  bundleIdPrefix: com.wisp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
targets:
  Wisp:
    type: application
    platform: iOS
    sources:
      - Wisp
    info:
      path: Wisp/Info.plist
      properties:
        CFBundleDisplayName: Wisp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.wisp.app
            CFBundleURLSchemes:
              - wisp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wisp.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Wisp/Wisp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wisp.app
    dependencies:
      - sdk: AppIntents.framework
      - package: MarkdownUI
      - target: WispShareExtension
        embed: true
      - target: WispActivityWidget
        embed: true

  WispShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - WispShareExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wisp.app.ShareExtension
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: WispShareExtension/Info.plist
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: WispShareExtension/WispShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wisp.app
    dependencies:
      - sdk: AppIntents.framework

  WispActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - WispActivityWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wisp.app.WispActivityWidget
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: WispActivityWidget/Info.plist
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: WispActivityWidget/WispActivityWidget.entitlements

  WispTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - WispTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wisp.app.tests
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "59"
      SWIFT_EMIT_LOC_STRINGS: NO
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wisp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Wisp"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Wisp
      - sdk: AppIntents.framework
